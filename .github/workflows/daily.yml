name: Daily A-share snapshot

on:
  schedule:
    # 交易日收盘后跑：北京时间 17:20 = UTC 09:20
    # 加一次凌晨补跑，覆盖节假日 / 上游延迟的情况
    - cron: '20 9 * * 1-5'
    - cron: '50 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制抓取（忽略交易日判断）'
        required: false
        default: 'false'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ashare-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch, stamp with the real trade date, build and commit
        id: run
        env:
          FORCE: ${{ github.event.inputs.force || '0' }}
          # CI builds without the inlined fallback: the page fetches data/*.json,
          # which keeps each daily commit small.
          EMBED: '0'
        run: |
          set -euo pipefail
          ./daily.sh
          echo "changed=$(git log -1 --pretty=%s | grep -q snapshot && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### A股快照任务"
            echo ""
            echo "- 步骤: ${{ steps.run.outcome }}"
            echo "- 最新提交: \`$(git log -1 --pretty='%s (%cr)')\`"
            echo "- 可用日期: $(ls data/*.json 2>/dev/null | wc -l) 天"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # ship only what the site actually needs
          path: |
            index.html
            data/
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
